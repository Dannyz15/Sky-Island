[package]
name = "sky-island"
version = "0.3.0"
edition = "2024"
description = "A notch for the top of your Windows screen: music, lyrics, timer, water reminders, file shelf and system notices."
license = "MIT"
publish = false
repository = "https://github.com/Dannyz15/Sky-Island"

[dependencies]
fontdue = "0.9.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde_json = "1.0.154"
softbuffer = "0.4.8"
tiny-skia = "0.12.0"
tray-icon = "0.26.1"
ureq = { version = "3.5.0", features = ["json"] }
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Display", "Win32_System_Power", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Networking_Connectivity", "Win32_System_Variant", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory"] }
windows-core = "0.62"
winit = "0.30.13"
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1

[build-dependencies]
embed-resource = "3.0.12"
