name: CI

# Runs the tests and the lint check on every push to main and on every pull request, and makes sure the
# release build (with its icon and version resource) still works.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml makes rustup install the exact compiler named there, with clippy and rustfmt, on the first cargo call.
      # Not one of GitHub's own actions, so it is pinned to an exact commit (version 2.9.3): a tag can be moved
      # to other code, a commit cannot. Dependabot proposes newer ones.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The installer script has its own copy of the version. If it is not the one in Cargo.toml, the setup that is
      # built has the wrong name and the app's update check refuses the release.
      - name: Installer version matches Cargo.toml
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $setup = (Select-String -Path installer/sky-island.iss -Pattern '#define AppVersion "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($cargo -ne $setup) { throw "Cargo.toml says $cargo but installer/sky-island.iss says $setup" }
          "Both say $cargo"
      # Known security problems, licences and sources of the crates the app is built from (see deny.toml). The tool's own
      # GitHub action only runs on Linux, and this runs on Windows, so the tool is built from its published source: an
      # exact version, with the crate versions in its own lock file. The cache above keeps the built program, so only the
      # first run pays for the build.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Crates (known problems, licences, sources)
        run: cargo deny check
      - name: Formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
